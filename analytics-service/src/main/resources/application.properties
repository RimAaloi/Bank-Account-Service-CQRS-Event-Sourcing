# Configuration du service d'analyse
spring.application.name=analytics-service
server.port=8084

# Base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:analytics-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Configuration de la serialisation Axon
axon.serializer.events=jackson
axon.serializer.messages=xstream
axon.serializer.general=jackson

# Configuration du serveur Axon
axon.axonserver.enabled=true
axon.axonserver.servers=localhost
